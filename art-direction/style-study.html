<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>浆果丛林 · 清爽卡通画风</title>
  <style>
    :root{color-scheme:light;font:15px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#244a37;background:#f7faf1}
    *{box-sizing:border-box}body{margin:0}a{color:inherit}header,main,footer{max-width:1480px;margin:auto;padding:24px 4vw}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #244a371a}header a{font-size:13px;text-decoration:none}.brand{font-weight:650;letter-spacing:2px}.intro{max-width:850px;padding:22px 0 28px}.eyebrow{color:#65865d;font-size:12px;letter-spacing:2px}h1{font-size:clamp(27px,3vw,43px);line-height:1.35;letter-spacing:1px;margin:12px 0}p{color:#667763;margin:12px 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0;background:#fff;border:1px solid #244a371a;border-radius:16px;overflow:hidden}figure a{display:block}figure img{width:100%;height:auto;display:block;aspect-ratio:1.5;object-fit:contain;background:#e8f1df}figcaption{padding:20px 22px}figcaption strong{font-size:18px;font-weight:600}figcaption p{font-size:13px;margin:5px 0 0}.badge{display:inline-block;font-size:11px;border-radius:20px;padding:4px 11px;background:#e0efd0;color:#356033;margin-bottom:9px}.old .badge{background:#edf0e9;color:#788174}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.button{padding:10px 18px;border-radius:24px;text-decoration:none;font-size:13px;border:1px solid #4e794e}.button.primary{background:#386440;color:white}.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:34px 0 20px}.principles h2{font-size:16px;font-weight:600;margin:0}.principles p{font-size:13px;margin:7px 0}footer{font-size:12px;color:#778370;border-top:1px solid #244a371a;margin-top:20px}
    @media(max-width:700px){header,main,footer{padding:20px 5vw}.intro{padding:8px 0 20px}.compare{grid-template-columns:1fr;gap:20px}.principles{grid-template-columns:1fr;gap:20px}figcaption{padding:17px 19px}.actions{gap:10px}h1{font-size:29px}}
  </style>
</head>
<body>
  <header><span class="brand">摩尔庄园 · 画风调整</span><a href="index.html">返回美术画册 ↗</a></header>
  <main>
    <section class="intro">
      <span class="eyebrow">浆果丛林 · 新版样张</span>
      <h1>清爽、圆润，<br>让每一处风景更好辨认。</h1>
      <p>放大树冠、浆果和岩石的形状，减少零碎装饰。用清晰的色块、开阔的小径和柔和的日光，重新调整庄园的卡通气质。</p>
    </section>
    <section class="compare" aria-label="新版与上一版对比">
      <figure>
        <a href="images/berry-jungle.png" target="_blank" rel="noopener" aria-label="查看新版完整原图"><img src="images/berry-jungle.png" alt="新版浆果丛林：圆润的树冠、开阔的黄色小径、红色浆果与湖蓝溪水" width="1536" height="1024"></a>
        <figcaption><span class="badge">新版 · 清爽卡通</span><br><strong>让造型和色彩成为重点</strong><p>简化枝叶与纹理，给草地、道路和水岸留出更多空间。</p></figcaption>
      </figure>
      <figure class="old">
        <a href="style-studies/berry-jungle-v1.png" target="_blank" rel="noopener" aria-label="查看上一版完整原图"><img src="style-studies/berry-jungle-v1.png" alt="上一版浆果丛林：密集的枝叶、藤蔓、苔藓、花草和较强的光影" width="1536" height="1024"></a>
        <figcaption><span class="badge">上一版</span><br><strong>细节与装饰过于密集</strong><p>写实表面和密集植被，让画面显得繁复，削弱了卡通感。</p></figcaption>
      </figure>
    </section>
    <div class="actions"><a class="button primary" href="images/berry-jungle.png" download="berry-jungle-clean-cartoon.png">下载新版原图 ↓</a><a class="button" href="index.html">浏览画册 →</a></div>
    <section class="principles" aria-label="新版美术方向">
      <div><h2>造型更简洁</h2><p>整块的圆润树冠、光滑岩石和夸张的浆果，让轮廓一眼可读。</p></div>
      <div><h2>色彩更清透</h2><p>浅绿、湖蓝和奶油黄组成大色块，用少量草莓红点缀。</p></div>
      <div><h2>光影更轻柔</h2><p>柔和日光与轻盈投影保留空间层次，减少浓雾、光束和强反差。</p></div>
    </section>
  </main>
  <footer>本轮先更新浆果丛林主场景效果图。AI 美术草案 · 地图布局待与页游核对 · 新版 3D 模型与场景尚未制作。</footer>
</body>
</html>
