<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102e34"><meta name="description" content="受摩尔庄园启发的可探索黑森林：苔桥、古树、荧光蘑菇与月光林隙。Three.js 实时三维场景。"><title>黑森林 · 摩尔庄园</title><link rel="icon" href="./crest.svg" type="image/svg+xml"></head>
<body><main id="forest-app">
