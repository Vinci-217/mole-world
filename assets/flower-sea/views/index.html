<style>*{box-sizing:border-box}body{margin:0;background:#edf2e5;color:#2b4635;font:15px/1.9 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:38px 28px}h1{font-size:28px;font-weight:500;letter-spacing:.13em;margin:14px 0}a{color:#486f45}p{max-width:850px;color:#63765c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:30px}figure{margin:0;background:#fbfcf6;border:1px solid #d7e1cd;border-radius:10px;overflow:hidden}img{width:100%;display:block}figcaption{padding:14px 19px}figcaption small{display:block;font-size:12px;color:#6f8067}.top img{max-height:1000px;object-fit:contain;background:#e3ecd7}@media(max-width:800px){main{padding:24px 16px}.grid{grid-template-columns:1fr}h1{font-size:23px}}</style></head>
<body><main><a href="../../../flower-sea.html">← 进入 3D 花海</a><h1>神秘花海 · 多视角设计参考</h1><p>四张图围绕同一空间布局绘制：南侧为入口，北侧为远方花屋。房屋按正常两层建筑尺度布置，前视图中的大小来自远近透视。以下为 AI 场景设计图；后视图对原图未展示的部分作风格补全，非实机截图或测绘图。</p>
<div class="grid"><figure><a href="front.png"><img src="front.png" alt="前视：从南侧入口朝北看，远方房屋在右后方"></a><figcaption>前视 · 南 → 北<small>前景为藤蔓入口与巨花，房屋位于更远的花坡。</small></figcaption></figure>
<figure><a href="left.png"><img src="left.png" alt="左视：从西向东看，房屋在画面左侧，入口在右侧"></a><figcaption>左视 · 西 → 东<small>藤蔓拱门显露侧面，建筑保持正常尺度。</small></figcaption></figure>
<figure><a href="back.png"><img loading="lazy" src="back.png" alt="后视：从北侧房屋后方回望入口，房屋成为近景"></a><figcaption>后视 · 北 → 南<small>建筑背面为依据同一风格补全；入口与巨花退到远处。</small></figcaption></figure>
<figure class="top"><a href="top.png"><img loading="lazy" src="top.png" alt="俯视布局：右上房屋、左下藤蔓入口、右下巨花和连接花径"></a><figcaption>俯视 · 北在上<small>核对前后分区、连通花径与地标间距。</small></figcaption></figure></div></main></body></html>
